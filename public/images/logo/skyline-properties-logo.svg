<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 168" fill="none" role="img" aria-hidden="true">
  <title>Skyline Properties mark</title>
  <defs>
    <clipPath id="lime-inner">
      <circle cx="96" cy="84" r="52"/>
    </clipPath>
    <clipPath id="navy-inner">
      <circle cx="204" cy="84" r="52"/>
    </clipPath>
  </defs>

  <circle cx="96" cy="84" r="63" fill="#ffffff"/>
  <circle cx="204" cy="84" r="63" fill="#ffffff"/>

  <circle cx="96" cy="84" r="63" stroke="#8CC63F" stroke-width="20"/>
  <circle cx="204" cy="84" r="63" stroke="#0B2C5E" stroke-width="20"/>

  <g clip-path="url(#navy-inner)">
    <circle cx="96" cy="84" r="63" stroke="#8CC63F" stroke-width="20"/>
  </g>
  <g clip-path="url(#lime-inner)">
    <circle cx="204" cy="84" r="63" stroke="#0B2C5E" stroke-width="20"/>
  </g>

  <!-- Left skyline: lime towers -->
  <g clip-path="url(#lime-inner)" fill="#8CC63F">
    <rect x="64" y="92" width="13" height="36" rx="0.6"/>
    <polygon points="64,92 70.5,84 77,92"/>
    <rect x="80" y="68" width="15" height="60" rx="0.6"/>
    <rect x="86.25" y="54" width="2.5" height="14" rx="0.4"/>
    <rect x="98" y="78" width="14" height="50" rx="0.6"/>
    <polygon points="98,78 105,68 112,78"/>
  </g>

  <!-- Right skyline: navy towers -->
  <g clip-path="url(#navy-inner)" fill="#0B2C5E">
    <rect x="178" y="86" width="13" height="42" rx="0.6"/>
    <polygon points="178,86 184.5,76 191,86"/>
    <rect x="194" y="62" width="16" height="66" rx="0.6"/>
    <rect x="200.5" y="48" width="3" height="14" rx="0.4"/>
    <rect x="213" y="76" width="13" height="52" rx="0.6"/>
    <rect x="218.25" y="64" width="2.5" height="12" rx="0.4"/>
  </g>
</svg>
